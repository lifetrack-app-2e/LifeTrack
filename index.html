nav{width:220px;background:var(--sf);border-right:1px solid var(--bd);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;transition:width .2s}
nav.c{width:68px}nav.c .l,nav.c .brand span,nav.c .me div{display:none}
.brand{font-weight:700;font-size:18px;display:flex;gap:8px;align-items:center;padding:6px 8px 14px;color:var(--pr)}

.mu{color:var(--mu);font-size:13px}.q{font-style:italic}

.big{font-size:30px;font-weight:700}
.hero{background:linear-gradient(135deg,var(--pr),var(--vi));color:#fff;border:0}

const translateUI = root => {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  const words = uiLex[LANG] ? {...uiLex[LANG], ...(extraLex[LANG] || {})} : extraLex[LANG];
  if (!words || !root) return;
  const keys = Object.keys(words).sort((a,b)=>b.length-a.length);
  const convert = value => keys.reduce((text,key)=>text.split(key).join(words[key]),value);
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  while(walker.nextNode()) walker.currentNode.nodeValue=convert(walker.currentNode.nodeValue);
  root.querySelectorAll('input[placeholder],textarea[placeholder],[aria-label],[title]').forEach(el=>['placeholder','aria-label','title'].forEach(attr=>{if(el.hasAttribute(attr))el.setAttribute(attr,convert(el.getAttribute(attr)))}));
};
const tr = (k, idx = -1) => { const d = dict[LANG] || dict['en']; return idx >= 0 ? (d[k][idx] || dict['en'][k][idx]) : (d[k] || dict['en'][k]); };

const NAV_IDS = ['overview','daily','annual','analytics','goals','journal','premium'];
const COL=['#4f46e5','#7c3aed','#0ea5e9','#22c55e','#f59e0b','#ec4899','#ef4444','#14b8a6'];
const ICO=['📖','🙏','🗣️','🏃','📚','🎓','💧','💡','🧘','🍎','😴','✍️'];
const QUO=['Small steps every day lead to big change.','We are what we repeatedly do.','Discipline is choosing what you want most over what you want now.','Don’t break the chain.'];
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ALL=[0,1,2,3,4,5,6];
let S,view='overview',sbc=false,Y=T.getFullYear(),M=T.getMonth(),AV=innerWidth>860?'year':'month';

function seed(){const H=[['Bible Reading','📖','20 minutes'],['Prayer','🙏','10 minutes'],['English Learning','🗣️','30 minutes'],['Exercise','🏃','30 minutes'],['Reading Books','📚','15 minutes'],['Studying','🎓','60 minutes'],['Drinking Water','💧','2 liters'],['Learning New Skills','💡','30 minutes']];
const habits=H.map((h,i)=>({id:'h'+i,name:h[0],icon:h[1],color:COL[i%8],desc:'Daily practice: '+h[0].toLowerCase(),target:h[2],days:ALL,remind:''}));
const logs={};let r=7;habits.forEach((h,i)=>{logs[h.id]={};for(let k=1;k<=75;k++){r=(r*9301+49297)%233280;if(r/233280<.55+.05*(i%4))logs[h.id][ymd(addD(T,-k))]=1}});
return{habits,logs,goals:[{id:'g1',title:'Read 12 books this year',due:ymd(addD(T,120)),pr:40,done:false}],journal:{},set:{name:'You',theme:'auto',notif:false,avatar:''}}}
try{S=JSON.parse(localStorage.getItem('lifetrack'))}catch(e){}
if(!S)S=seed();
S.habits.forEach(h=>h.remind=(h.remind||'').split(',').filter(Boolean).map(t=>t.slice(0,5)).join(','));
const save=()=>{try{localStorage.setItem('lifetrack',JSON.stringify(S))}catch(e){}};
const uid=()=>'i'+Math.random().toString(36).slice(2,9);
const sch=(h,d)=>h.days.includes(d.getDay())&&!(S.logs[h.id]&&S.logs[h.id][ymd(d)]===2);
const done=(h,ds)=>!!(S.logs[h.id]&&S.logs[h.id][ds]===1);
const getAv=()=>S.set.avatar?`<img src="${S.set.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:esc(S.set.name[0]||'U').toUpperCase();
function st(h,d){const ds=ymd(d),v=S.logs[h.id]&&S.logs[h.id][ds];if(v===1)return'd';if(v===3)return'm';if(v===2||!h.days.includes(d.getDay()))return'x';return ds>=TD?'f':'m'}
function streak(h){let c=0;for(let i=0;i<730;i++){const d=addD(T,-i),s=st(h,d);if(s==='x')continue;if(s==='d')c++;else if(i>0)break}return c}
function dayRate(d){const hs=S.habits.filter(h=>sch(h,d));return[hs.filter(h=>done(h,ymd(d))).length,hs.length]}
function streaks(){let cur=0,best=0,run=0,counting=true;for(let i=0;i<730;i++){const d=addD(T,-i),[a,b]=dayRate(d);if(!b)continue;const full=a===b;if(full)run++;else{if(i>0||a<b&&i>0){}best=Math.max(best,run);if(counting&&i>0)cur=run,counting=false;else if(counting&&i===0){}run=0;if(i===0)counting=true}}
best=Math.max(best,run);if(counting)cur=run;return[cur,best]}
function consistency(days){let a=0,b=0;for(let i=0;i<days;i++){const d=addD(T,-i);if(i===0)continue;const r=dayRate(d);a+=r[0];b+=r[1]}return b?Math.round(100*a/b):0}
function hRate(h,days){let a=0,b=0;for(let i=1;i<=days;i++){const d=addD(T,-i);if(sch(h,d)){b++;if(done(h,ymd(d)))a++}}return b?Math.round(100*a/b):0}
function recovery(){let miss=0,rec=0;S.habits.forEach(h=>{for(let i=1;i<200;i++){const d=addD(T,-i);if(st(h,d)!=='m')continue;miss++;for(let j=1;j<=7;j++){const n=addD(d,j);if(n>T)break;if(sch(h,n)){if(done(h,ymd(n)))rec++;break}}}});return miss?Math.round(100*rec/miss):0}
function weekRate(w){let a=0,b=0;for(let i=0;i<7;i++){const d=addD(T,-(w*7+i));if(d>T)continue;const r=dayRate(d);a+=r[0];b+=r[1]}return b?Math.round(100*a/b):0}
function toggle(id,ds){S.logs[id]=S.logs[id]||{};if(S.logs[id][ds]===1)delete S.logs[id][ds];else S.logs[id][ds]=1;save();render()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function stat(l,v,s){return`<div class="card"><div class="mu">${l}</div><div class="big">${v}</div><div class="mu">${s}</div></div>`}
function habitCard(h){const ok=done(h,TD),sk=streak(h);return`<div class="card"><div class="hc"><div class="ic" style="background:${h.color}22">${h.icon}</div><div style="flex:1;min-width:0"><b>${esc(h.name)}</b><div class="mu">${esc(h.desc)} · Target: ${esc(h.target)}</div></div><input type="checkbox" aria-label="Complete ${esc(h.name)}" data-a="tg" data-id="${h.id}" ${ok?'checked':''}></div>
<div class="bar"><i style="width:${ok?100:hRate(h,7)}%;background:${ok?'var(--ok)':h.color}"></i></div><div class="row sb mu" style="margin-top:6px"><span>🔥 ${sk}-day streak · ${hRate(h,7)}% this week</span><span>${h.remind?'⏰ '+h.remind.split(',').join(' · '):''}</span></div>
<div class="row" style="margin-top:8px"><button class="b" data-a="edit" data-id="${h.id}">Edit</button><button class="b d" data-a="del" data-id="${h.id}">Delete</button></div></div>`}

  ar:['LifeTrack المميز','خطة بسيطة لدعم تطوير LifeTrack مستقبلًا.','العضوية المميزة','/ شهريًا','السعر المخطط للاشتراك','مزايا العضوية المميزة','تحليلات متقدمة للعادات','سجل تقدم أكثر تفصيلًا','مزامنة سحابية بين الأجهزة','أهداف وخيارات تخصيص إضافية','توفر الدفع','غير متاح بعد','LifeTrack مجاني حاليًا إلى أن نجهز مزود دفع موثوقًا وآلية تحقق آمنة.','لا يتم تحصيل أي مدفوعات. لا ترسل أموالًا إلى محفظة شخصية أو إلى أي شخص يدعي تمثيل LifeTrack.','ستتوفر الاشتراكات لاحقًا','لماذا لم يتم تفعيل الدفع','تتطلب المدفوعات المتكررة حساب تاجر معتمدًا وخادمًا آمنًا وإشعارات دفع موثقة. لن تُفعّل العضوية المميزة إلا بعد تأكيد مزود الخدمة للدفع. لا يخزن هذا التطبيق بيانات البطاقات.'],
  hi:['LifeTrack प्रीमियम','LifeTrack के भविष्य के विकास में सहयोग देने की सरल योजना।','प्रीमियम सदस्यता','/ माह','नियोजित सदस्यता मूल्य','प्रीमियम में क्या शामिल होगा','उन्नत आदत विश्लेषण','अधिक विस्तृत प्रगति इतिहास','डिवाइसों के बीच क्लाउड सिंक','अधिक लक्ष्य और वैयक्तिकरण','भुगतान उपलब्धता','अभी उपलब्ध नहीं','विश्वसनीय भुगतान प्रदाता और सुरक्षित भुगतान सत्यापन की व्यवस्था होने तक LifeTrack मुफ़्त है।','अभी कोई भुगतान नहीं लिया जा रहा है। किसी निजी वॉलेट या LifeTrack का प्रतिनिधि होने का दावा करने वाले व्यक्ति को पैसे न भेजें।','सदस्यता बाद में उपलब्ध होगी','भुगतान अभी क्यों चालू नहीं है','आवर्ती भुगतान के लिए स्वीकृत व्यापारी खाता, सुरक्षित सर्वर और सत्यापित भुगतान सूचनाएँ आवश्यक हैं। प्रदाता द्वारा भुगतान की पुष्टि के बाद ही प्रीमियम सक्रिय होगा। यह ऐप कार्ड विवरण संग्रहीत नहीं करता।'],
  th:['LifeTrack Premium','แพ็กเกจง่าย ๆ เพื่อสนับสนุนการพัฒนา LifeTrack ในอนาคต','สมาชิกพรีเมียม','/ เดือน','ราคาสมัครสมาชิกที่วางแผนไว้','สิ่งที่จะรวมอยู่ใน Premium','วิเคราะห์นิสัยขั้นสูง','ประวัติความคืบหน้าที่ละเอียดขึ้น','ซิงค์ข้อมูลบนคลาวด์ระหว่างอุปกรณ์','เป้าหมายและการปรับแต่งเพิ่มเติม','สถานะการชำระเงิน','ยังไม่พร้อมให้บริการ','LifeTrack ใช้ได้ฟรีระหว่างที่เราจัดเตรียมผู้ให้บริการชำระเงินที่น่าเชื่อถือและระบบตรวจสอบที่ปลอดภัย','ขณะนี้ไม่มีการเรียกเก็บเงิน อย่าส่งเงินไปยังกระเป๋าเงินส่วนตัวหรือผู้ที่อ้างว่าเป็นตัวแทนของ LifeTrack','การสมัครสมาชิกจะเปิดให้ใช้ภายหลัง','เหตุใดจึงยังชำระเงินไม่ได้','การชำระเงินต่อเนื่องต้องใช้บัญชีผู้ค้าที่ได้รับอนุมัติ เซิร์ฟเวอร์ที่ปลอดภัย และการแจ้งเตือนการชำระเงินที่ตรวจสอบแล้ว Premium จะเปิดใช้เมื่อผู้ให้บริการยืนยันการชำระเงินเท่านั้น แอปนี้ไม่จัดเก็บข้อมูลบัตร'],
  my:['LifeTrack Premium','အစီအစဉ်ရိုးရှင်းစွာဖြင့် LifeTrack ၏ အနာဂတ်ဖွံ့ဖြိုးမှုကို ပံ့ပိုးပါ။','ပရီမီယံအသင်းဝင်မှု','/ လ','စီစဉ်ထားသော အသင်းဝင်ကြေး','ပရီမီယံတွင် ပါဝင်မည့်အရာများ','အဆင့်မြင့် အလေ့အကျင့် ခွဲခြမ်းစိတ်ဖြာမှု','ပိုမိုအသေးစိတ်သော တိုးတက်မှုမှတ်တမ်း','စက်များအကြား cloud ထပ်တူပြုခြင်း','ပန်းတိုင်နှင့် စိတ်ကြိုက်ပြင်ဆင်မှုများ ပိုမိုရရှိခြင်း','ငွေပေးချေမှု အခြေအနေ','မရရှိနိုင်သေးပါ','ယုံကြည်စိတ်ချရသော ငွေပေးချေမှုဝန်ဆောင်မှုနှင့် လုံခြုံသော အတည်ပြုစနစ်ကို ပြင်ဆင်နေစဉ် LifeTrack ကို အခမဲ့အသုံးပြုနိုင်ပါသည်။','လက်ရှိတွင် ငွေပေးချေမှု မကောက်ခံပါ။ ကိုယ်ပိုင်ပိုက်ဆံအိတ်သို့ သို့မဟုတ် LifeTrack ကိုယ်စားလှယ်ဟု ဆိုသူထံ ငွေမပို့ပါနှင့်။','အသင်းဝင်မှုကို နောက်ပိုင်းတွင် ဖွင့်ပါမည်','ငွေပေးချေမှုကို အဘယ်ကြောင့် မဖွင့်သေးသနည်း','ထပ်တလဲလဲ ငွေပေးချေရန် အတည်ပြုထားသော ကုန်သည်အကောင့်၊ လုံခြုံသော ဆာဗာနှင့် စစ်ဆေးပြီး ငွေပေးချေမှု အသိပေးချက်များ လိုအပ်ပါသည်။ ဝန်ဆောင်မှုပေးသူက အတည်ပြုပြီးမှ ပရီမီယံကို ဖွင့်ပါမည်။ ဤအက်ပ်သည် ကတ်အချက်အလက်ကို မသိမ်းဆည်းပါ။'],
  ksw:['LifeTrack Premium','တၢ်ရဲၣ်တၢ်ကျဲၤလၢ ကဆီၣ်ထွဲ LifeTrack အနာဂတ်တၢ်မၤထီၣ်ထီအဂီၢ်။','ပရီမံယၢၣ်အကရူၢ်','/ လါ','တၢ်ရဲၣ်တၢ်ကျဲၤအပှ့ၤ','တၢ်လၢ Premium ကပၣ်ဃုာ်','တၢ်မၤလိအလုၢ်အလၢ်အတၢ်သမံသမိး','တၢ်လဲၤထီၣ်လဲၤထီအတၢ်ကွဲးနီၣ်လၢအသီ','Cloud တၢ်ဒုးသ့ၣ်ညါလိာ်သးလၢ devices အဘၢၣ်စၢၤ','တၢ်တိာ်ပာ်ဒီးတၢ်ဆီတလဲလၢအါထီၣ်','တၢ်ဟ့ၣ်အပှ့ၤအတၢ်အိၣ်သး','တၢ်သူအီၤတသ့ဒံးဘၣ်','LifeTrack ကအိၣ်ဒီးအပှ့ၤတအိၣ်ဒံးဘၣ် ဖဲပရဲၣ်ကျဲၤတၢ်ဟ့ၣ်အပှ့ၤလၢအဘံၣ်ဘၢအခါ။','ပတဟံးန့ၢ်တၢ်ဟ့ၣ်အပှ့ၤနီတမံၤဘၣ်။ တဟ့ၣ်လီၤစ့ဆူပှၤတဂၤအပိုက်ဆံအလီၢ် မ့တမ့ၢ်ပှၤလၢအတဲဝဲလၢအမ့ၢ် LifeTrack ကိုယ်စားလှယ်တဂၤဘၣ်။','တၢ်ဆဲးလီၤမံၤကအိးထီၣ်လၢခံ','ဘၣ်မနုၤအဃိ တၢ်ဟ့ၣ်အပှ့ၤတအိးထီၣ်ဒံးဘၣ်','တၢ်ဟ့ၣ်အပှ့ၤလၢတလီၢ်တလီၢ်အဂီၢ် လိၣ်ဘၣ်တၢ်ပျဲတၢ်ကဲၣ်အကီၢ်၊ server လၢအဘံၣ်ဘၢ ဒီးတၢ်ဟ့ၣ်အပှ့ၤတၢ်ပာ်ဂၢၢ်ပာ်ကျၢၤ။ Premium ကအိးထီၣ်ဖဲပှၤဟ့ၣ်တၢ်မၤစၢၤပာ်ဂၢၢ်ပာ်ကျၢၤတၢ်ဟ့ၣ်အပှ့ၤဝံၤအခါ။ App အံၤတသိမ်းဃာ် card တၢ်ဂ့ၢ်တၢ်ကျိၤဘၣ်။']

const premiumText=()=>premiumCopy[LANG]||premiumCopy.en;
const V={
overview(){const [c,b]=streaks(),[a,t]=dayRate(T);
return`<div class="card hero"><h1>${tr('hello')}</h1><div>${T.toDateString()}</div><div class="q" style="margin-top:8px">“${QUO[T.getDate()%QUO.length]}”</div></div>
<div class="g g4">${stat('Current Streak',c+' days','All habits done')}${stat('Best Streak',b+' days','Last 2 years')}${stat('Today',t?Math.round(100*a/t)+'%':'–',a+' of '+t+' done')}${stat('Consistency',consistency(30)+'%','Last 30 days')}</div>
<h2>Today’s habits</h2><div class="g g2">${S.habits.filter(h=>sch(h,T)).map(habitCard).join('')||'<div class="card mu">Nothing scheduled today.</div>'}</div>`},
daily(){return`<div class="row sb"><h1>${tr('nav',1)}</h1><button class="b p" data-a="add">+ Add habit</button></div><div class="g g2">${S.habits.map(habitCard).join('')||'<div class="card mu">No habits yet.</div>'}</div>`},
annual(){const mons=AV==='year'?[...Array(12).keys()]:[M];
const tabs=mons.map(m=>{const n=new Date(Y,m+1,0).getDate();let hd='<tr><th class="n">'+MN[m]+' '+Y+'</th>';for(let d=1;d<=n;d++){const dw=['Su','Mo','Tu','We','Th','Fr','Sa'][new Date(Y,m,d).getDay()];hd+=`<th>${d}<br><span style="font-weight:normal;font-size:9px;color:var(--mu)">${dw}</span></th>`}hd+='<th>Total</th></tr>';
const rows=S.habits.map(h=>{let tot=0,tds='';for(let d=1;d<=n;d++){const dt=new Date(Y,m,d),s=st(h,dt);if(s==='d')tot++;const dis=false;tds+=`<td><button class="cl ${s==='f'?'f':s}" ${dis?'disabled':''} title="${ymd(dt)}" aria-label="${esc(h.name)} ${ymd(dt)}" data-a="cell" data-id="${h.id}" data-d="${ymd(dt)}"></button></td>`}
return`<tr><td class="n">${h.icon} ${esc(h.name)}</td>${tds}<td><b>${tot}</b></td></tr>`}).join('');return`<div class="hm card"><table>${hd}${rows}</table></div>`}).join('');
const tot=S.habits.map(h=>{let c=0;for(let m=0;m<12;m++)for(let d=1;d<=31;d++){const dt=new Date(Y,m,d);if(dt.getMonth()===m&&st(h,dt)==='d')c++}return`<span class="tag hi">${h.icon} ${c} days</span>`}).join(' ');
return`<div class="row sb"><h1>${tr('nav',2)}</h1><div class="row"><button class="b" data-a="yr" data-v="-1">‹</button><b>${Y}</b><button class="b" data-a="yr" data-v="1">›</button>
<select data-c="av"><option value="year" ${AV==='year'?'selected':''}>Full year</option><option value="month" ${AV==='month'?'selected':''}>Month</option></select>
${AV==='month'?`<select data-c="mo">${MN.map((n,i)=>`<option value="${i}" ${i===M?'selected':''}>${n}</option>`).join('')}</select>`:''}</div></div>
<div class="row mu" style="margin:8px 0 12px;gap:16px"><span><i class="cl d" style="display:inline-block;width:14px;height:14px;vertical-align:middle"></i> Completed</span><span><i class="cl m" style="display:inline-block;width:14px;height:14px;vertical-align:middle"></i> Missed</span><span><i class="cl x" style="display:inline-block;width:14px;height:14px;vertical-align:middle"></i> Excluded</span><span><i class="cl" style="display:inline-block;width:14px;height:14px;vertical-align:middle"></i> Future</span><span>Tap any date to cycle: Completed → Missed → Excluded → clear</span></div>${mons.length?tabs:''}<div class="card"><b>Year totals</b><div class="row" style="margin-top:8px">${tot}</div></div>`},
analytics(){const hs=S.habits.map(h=>({h,r:hRate(h,30)})).sort((a,b)=>b.r-a.r);
const wk=[...Array(8).keys()].reverse().map(w=>{let c=0;for(let i=0;i<7;i++){const d=addD(T,-(w*7+i));S.habits.forEach(h=>{if(done(h,ymd(d)))c++})}return c});const mx=Math.max(1,...wk);
const bars=wk.map((v,i)=>`<g><rect x="${i*40+10}" y="${110-v/mx*100}" width="28" height="${v/mx*100}" rx="6" fill="var(--pr)"><title>${v} completions</title></rect><text x="${i*40+24}" y="124" text-anchor="middle">${i===7?'Now':'-'+(7-i)+'w'}</text><text x="${i*40+24}" y="${106-v/mx*100}" text-anchor="middle">${v}</text></g>`).join('');
const stab=[...Array(12).keys()].reverse().map(w=>{const r=weekRate(w);const k=r>=80?['hi','High']:r>=50?['me2','Medium']:['lo','Low'];return`<div style="text-align:center"><div class="tag ${k[0]}">${k[1]}</div><div class="mu">${r}%</div><div class="mu" style="font-size:10px">${w?'-'+w+'w':'Now'}</div></div>`}).join('');
const rc=recovery(),C=2*Math.PI*45;
const mo=[...Array(6).keys()].reverse().map(k=>{const f=new Date(T.getFullYear(),T.getMonth()-k,1),n=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();let c=0;S.habits.forEach(h=>{for(let d=1;d<=n;d++)if(done(h,ymd(new Date(f.getFullYear(),f.getMonth(),d))))c++});return[MN[f.getMonth()],c]});
const mm=Math.max(1,...mo.map(x=>x[1]));
const mbar=mo.map((x,i)=>`<g><rect x="${i*54+12}" y="${110-x[1]/mm*100}" width="36" height="${x[1]/mm*100}" rx="6" fill="var(--vi)"><title>${x[1]} completions</title></rect><text x="${i*54+30}" y="124" text-anchor="middle">${x[0]}</text><text x="${i*54+30}" y="${106-x[1]/mm*100}" text-anchor="middle">${x[1]}</text></g>`).join('');
const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((n,i)=>{let a=0,b=0;for(let k=1;k<=84;k++){const d=addD(T,-k);if(d.getDay()!==i)continue;const r=dayRate(d);a+=r[0];b+=r[1]}return[n,b?Math.round(100*a/b):0]});
const wbar=wd.map(x=>`<div class="mu">${x[0]} — ${x[1]}%</div><div class="bar" style="margin:2px 0 6px"><i style="width:${x[1]}%;background:var(--pr)"></i></div>`).join('');
const pts=[...Array(12).keys()].reverse().map((w,i)=>[i*28+10,100-weekRate(w)*.9]);

function cyc(id,ds){const L=S.logs[id]=S.logs[id]||{},h=S.habits.find(x=>x.id===id),v=L[ds],sc=h.days.includes(new Date(ds+'T00:00:00').getDay());if(!v)L[ds]=1;else if(v===1&&sc)L[ds]=3;else if(v===3)L[ds]=2;else delete L[ds];save();render()}

<label>Reminder times</label><div id="rt" class="row"></div><div class="row" style="margin-top:6px">${tp('fr','08:00')}<button class="b" type="button" data-a="radd">Add time</button></div><div class="row" style="margin-top:6px">${[['07:00','🌅 Morning'],['12:00','☀️ Noon'],['18:00','🌆 Evening'],['21:00','🌙 Night']].map(q=>`<button type="button" class="b" data-a="rpre" data-v="${q[0]}">${q[1]}</button>`).join('')}</div><div class="row" style="margin-top:16px"><button class="b p" type="submit">Save</button><button class="b" type="button" data-a="close">Cancel</button></div></form>`;
rchips();d.querySelector('form').onsubmit=e=>{e.preventDefault();if(!$('#fn').value.trim()){$('#fe').textContent='Please give your habit a name, then press Save.';$('#fn').focus();return}const days=[...d.querySelectorAll('.fs:checked')].map(x=>+x.value);const o={name:$('#fn').value.trim(),desc:$('#fd').value,target:$('#ft').value,icon:d.dataset.icon,color:d.dataset.color,days:days.length?days:ALL,remind:d.dataset.rem};

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id,v=el.dataset.v;
if(a==='nav'){view=v;render();scrollTo(0,0)}else if(a==='col'){sbc=!sbc;render()}
else if(a==='tg')toggle(id,TD);else if(a==='cell')cyc(id,el.dataset.d);
else if(a==='add')habitDlg();else if(a==='edit')habitDlg(id);
else if(a==='del'){ask('Delete this habit and its history?',()=>{S.habits=S.habits.filter(h=>h.id!==id);delete S.logs[id];save();render()})}
else if(a==='close')$('#dlg').close();
else if(a==='logout'){localStorage.removeItem('lifetrack_user');location.reload()}
else if(a==='radd'){const t=getT('fr'),d=$('#dlg');if(t){const l=d.dataset.rem?d.dataset.rem.split(','):[];if(!l.includes(t))l.push(t);d.dataset.rem=l.sort().join(',');rchips();$('#rt').insertAdjacentHTML('beforeend','<span class="mu">Added ✓</span>');setTimeout(rchips,900)}else $('#fr').focus()}
else if(a==='rpre'){const d=$('#dlg'),l=d.dataset.rem?d.dataset.rem.split(','):[];if(!l.includes(v))l.push(v);d.dataset.rem=l.sort().join(',');rchips()}
else if(a==='rdel'){const d=$('#dlg');d.dataset.rem=d.dataset.rem.split(',').filter(t=>t!==v).join(',');rchips()}
else if(a==='rdone'){S.logs[id]=S.logs[id]||{};S.logs[id][TD]=1;save();el.closest('.card').remove();render()}
else if(a==='rsn'){snz.push({id,at:Date.now()+600000});el.closest('.card').remove()}
else if(a==='rx')el.closest('.card').remove();
else if(a==='tadd'){const t=getT('t-'+id),h=S.habits.find(x=>x.id===id);if(t){const l=h.remind?h.remind.split(','):[];if(!l.includes(t))l.push(t);h.remind=l.sort().join(',');save();render()}}
else if(a==='tdel'){const h=S.habits.find(x=>x.id===id);h.remind=h.remind.split(',').filter(t=>t!==v).join(',');save();render()}
else if(a==='rtest'){if(S.set.notif&&window.Notification)Notification.requestPermission();remind(S.habits[0]||{id:'x',icon:'⏰',name:'Test reminder',target:''})}
else if(a==='pi'||a==='pc'){const d=$('#dlg');d.dataset[a==='pi'?'icon':'color']=v;el.parentNode.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s===el))}
else if(a==='yr'){Y+=+v;render()}
else if(a==='gadd'){const t=$('#gt').value.trim();if(t){S.goals.push({id:uid(),title:t,due:$('#gd').value,pr:0,done:false});save();render()}}
else if(a==='gdone'){const g=S.goals.find(x=>x.id===id);g.done=el.checked;if(g.done)g.pr=100;save();render()}
else if(a==='gdel'){S.goals=S.goals.filter(x=>x.id!==id);save();render()}
else if(a==='jsave'){S.journal[TD]={r:$('#jr').value,a:$('#ja').value,i:$('#ji').value};save();el.textContent='Saved ✓'}
else if(a==='nsave'){S.set.name=$('#nm').value||'You';save();render()}
else if(a==='export'){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='lifetrack-export.json';l.click()}
else if(a==='reset'){ask('Replace everything with demo data?',()=>{S=seed();save();render()})}
else if(a==='wipe'){ask('Erase all data? This cannot be undone.',()=>{S={habits:[],logs:{},goals:[],journal:{},set:{name:'You',theme:'auto',notif:false}};save();render()})}});

else if(c==='theme'){S.set.theme=el.value;save();render()}
else if(c==='notif'){S.set.notif=el.checked;if(el.checked&&window.Notification)Notification.requestPermission();save()}
else if(c==='gpr'){const g=S.goals.find(x=>x.id===el.dataset.id);g.pr=+el.value;g.done=g.pr===100;save();render()}});

const fired=new Set();let snz=[];
function tp(id,def){const[H,Mi]=def.split(':').map(Number),h12=H%12||12,o=(a,sel,f)=>a.map(x=>`<option value="${x}" ${x===sel?'selected':''}>${f(x)}</option>`).join('');
return`<span id="${id}" style="white-space:nowrap"><select aria-label="Hour">${o([...Array(12)].map((_,i)=>i+1),h12,x=>x)}</select> : <select aria-label="Minute">${o([...Array(60).keys()],Mi,x=>p(x))}</select> <select aria-label="AM or PM">${o(['AM','PM'],H<12?'AM':'PM',x=>x)}</select></span>`}
function getT(id){const s=document.querySelectorAll('#'+id+' select'),h=+s[0].value%12+(s[2].value==='PM'?12:0);return p(h)+':'+p(+s[1].value)}
function rchips(){const d=$('#dlg'),l=d.dataset.rem?d.dataset.rem.split(','):[];$('#rt').innerHTML=l.map(t=>`<span class="tag hi">${t} <a data-a="rdel" data-v="${t}" role="button" aria-label="Remove ${t}" style="cursor:pointer">✕</a></span>`).join('')||'<span class="mu">No reminders yet</span>'}
function remind(h){let b=$('#rm');if(!b){b=document.createElement('div');b.id='rm';b.style.cssText='position:fixed;right:12px;bottom:84px;z-index:20;display:flex;flex-direction:column;gap:8px;max-width:320px';document.body.appendChild(b)}
const c=document.createElement('div');c.className='card';c.innerHTML=`<b>⏰ ${h.icon} ${esc(h.name)}</b><div class="mu">Target: ${esc(h.target)}</div><div class="row" style="margin-top:8px"><button class="b p" data-a="rdone" data-id="${h.id}">Done</button><button class="b" data-a="rsn" data-id="${h.id}">Snooze 10m</button><button class="b" data-a="rx">Dismiss</button></div>`;b.appendChild(c);
if(S.set.notif&&window.Notification&&Notification.permission==='granted')try{new Notification('LifeTrack',{body:h.icon+' '+h.name+' — '+h.target})}catch(e){}}
setInterval(()=>{const n=new Date(),m=n.getHours()*60+n.getMinutes(),ds=ymd(n);
S.habits.forEach(h=>{if(!h.remind||!h.days.includes(n.getDay())||done(h,ds))return;h.remind.split(',').forEach(t=>{const[x,y]=t.split(':'),at=+x*60+ +y,k=h.id+ds+t;if(m>=at&&m-at<=5&&!fired.has(k)){fired.add(k);remind(h)}})});
snz=snz.filter(z=>{if(Date.now()<z.at)return true;const h=S.habits.find(q=>q.id===z.id);if(h&&!done(h,ds))remind(h);return false})},15000);

const checkAuth = () => {
  const user = localStorage.getItem('lifetrack_user');

  if (!user) {
    $('#login-screen').classList.remove('hidden');
    $('#app').classList.add('hidden');
    $('#bn').classList.add('hidden');
    applyLangUI();
  } else {
    $('#login-screen').classList.add('hidden');
    $('#app').classList.remove('hidden');
    $('#bn').classList.remove('hidden');
    render();
  }
};

$('#login-form').onsubmit = (e) => {
  e.preventDefault();
  localStorage.setItem('lifetrack_user', $('#login-email').value);
  checkAuth();
};

checkAuth();

  window.addEventListener('load', () => {

}

function setImageTheme(name) {
  const image = lifeTrackWallpapers[name];
  if (!image) return;

  document.documentElement.style.setProperty(
    "--theme-image",
    `url("${image}")`
  );

  localStorage.setItem("lifetrack_wallpaper", name);
}

function resetImageTheme() {
  document.documentElement.style.setProperty(
    "--theme-image",
    "none"
  );

  localStorage.removeItem("lifetrack_wallpaper");
  const choice = document.getElementById("wallpaper-choice");
  if (choice) choice.value = "";
}

document.addEventListener("change", event => {
  if (event.target.id === "wallpaper-choice") {
    if (event.target.value) setImageTheme(event.target.value);
    else resetImageTheme();
  }
});

/* Restore saved wallpaper */
const savedWallpaper =
  localStorage.getItem("lifetrack_wallpaper");

if (savedWallpaper && lifeTrackWallpapers[savedWallpaper]) {
  setImageTheme(savedWallpaper);
}
</script>
